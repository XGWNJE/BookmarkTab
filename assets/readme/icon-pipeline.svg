<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">MarkPad 书签图标解析顺序</title>
  <desc id="desc">图标按用户自定义、解析缓存、本地品牌与通用图标库、首字母兜底的顺序选择，最终选择权归用户。</desc>

  <rect width="1200" height="360" rx="28" fill="#181817"/>
  <text x="58" y="66" fill="#F4F1E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="36" font-weight="720">图标清晰，选择权仍然归用户</text>
  <text x="58" y="99" fill="#AAA394" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">优先尊重用户选择；自动匹配只解决没有自定义图标的书签。</text>

  <g id="pipeline" transform="translate(58 142)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g id="custom">
      <rect width="244" height="156" rx="18" fill="#F4F1E8"/>
      <circle cx="35" cy="34" r="15" fill="#111111"/>
      <text x="35" y="40" fill="#FFFFFF" text-anchor="middle" font-size="16" font-weight="700">1</text>
      <text x="62" y="41" fill="#111111" font-size="19" font-weight="720">用户自定义</text>
      <text x="24" y="82" fill="#333333" font-size="16">本地候选 · SVG 搜索</text>
      <text x="24" y="109" fill="#333333" font-size="16">或合格的高清位图</text>
      <text x="24" y="136" fill="#6F6F68" font-size="16">最高优先级</text>
    </g>

    <path d="M254 78h34" stroke="#777164" stroke-width="2" stroke-linecap="round"/>
    <path d="m281 71 8 7-8 7" fill="none" stroke="#777164" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g id="cache" transform="translate(300)">
      <rect width="216" height="156" rx="18" fill="#232321" stroke="#4A473F"/>
      <circle cx="35" cy="34" r="15" fill="#35332D"/>
      <text x="35" y="40" fill="#F4F1E8" text-anchor="middle" font-size="16" font-weight="700">2</text>
      <text x="62" y="41" fill="#F4F1E8" font-size="19" font-weight="720">解析缓存</text>
      <text x="24" y="82" fill="#DED9CC" font-size="16">复用已经确认的</text>
      <text x="24" y="109" fill="#DED9CC" font-size="16">自动匹配结果</text>
      <text x="24" y="136" fill="#AAA394" font-size="16">减少重复解析</text>
    </g>

    <path d="M526 78h34" stroke="#777164" stroke-width="2" stroke-linecap="round"/>
    <path d="m553 71 8 7-8 7" fill="none" stroke="#777164" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g id="libraries" transform="translate(572)">
      <rect width="278" height="156" rx="18" fill="#232321" stroke="#4A473F"/>
      <circle cx="35" cy="34" r="15" fill="#35332D"/>
      <text x="35" y="40" fill="#F4F1E8" text-anchor="middle" font-size="16" font-weight="700">3</text>
      <text x="62" y="41" fill="#F4F1E8" font-size="19" font-weight="720">本地图标库</text>
      <text x="24" y="82" fill="#DED9CC" font-size="16">品牌图标优先</text>
      <text x="24" y="109" fill="#DED9CC" font-size="16">通用工具图标后备</text>
      <text x="24" y="136" fill="#AAA394" font-size="16">保守匹配，不批量抓 favicon</text>
    </g>

    <path d="M860 78h34" stroke="#777164" stroke-width="2" stroke-linecap="round"/>
    <path d="m887 71 8 7-8 7" fill="none" stroke="#777164" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g id="fallback" transform="translate(906)">
      <rect width="178" height="156" rx="18" fill="#232321" stroke="#4A473F"/>
      <circle cx="35" cy="34" r="15" fill="#35332D"/>
      <text x="35" y="40" fill="#F4F1E8" text-anchor="middle" font-size="16" font-weight="700">4</text>
      <text x="62" y="41" fill="#F4F1E8" font-size="19" font-weight="720">首字母</text>
      <text x="24" y="82" fill="#DED9CC" font-size="16">没有合适图标时</text>
      <text x="24" y="109" fill="#DED9CC" font-size="16">提供稳定兜底</text>
      <text x="24" y="136" fill="#AAA394" font-size="16">永远可识别</text>
    </g>
  </g>
</svg>
